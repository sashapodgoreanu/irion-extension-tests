schemaVersion: 2

duckdb:
  version: v1.5.4
  ciToolsVersion: v1.5.4

defaultExtensions:
  - name: httpfs
    isUsed: true
  - name: mssql
    isUsed: true
    installFrom: community
  - name: ducklake
    isUsed: true
  - name: postgres_scanner
    isUsed: true
  - name: icu
    isUsed: true
  - name: azure
    isUsed: true
  - name: delta
    isUsed: true
  - name: iceberg
    isUsed: true
  - name: unity_catalog
    isUsed: true

testBatteries:
  httpfs:
    isEnabled: true
    runner: standard
    repository: duckdb/duckdb-httpfs
    pin: c3f215ab360f04dc3d3d5305fa81849c0121f111
    submodules: recursive
    setup: httpfs-services
    profiles:
      - name: sql
        tests: test/sql/*
        testConfig:
          kind: generated
          description: HTTPFS compatibility SQL suite
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
      - name: autoload
        tests: test/extension/*
        testConfig:
          kind: generated
          description: HTTPFS autoloading profile with HTTPFS initially unloaded
          excludedExtensions:
            - httpfs
          staticallyLoadedExtensions:
            - core_functions
    extensions:
      - name: httpfs
        isUsed: true
      - name: json
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
      - name: icu
        isUsed: true
      - name: sqlite_scanner
        isUsed: true
    ignoredTests:
      - path: test/sql/copy/s3/parquet_s3_tpcds.test_slow
        reason: Requires TPC-DS answer fixtures that are not present in the standalone HTTPFS checkout
      - path: test/extension/autoloading_base.test
        reason: Assumes no dynamically installed extensions, while the compatibility battery intentionally installs multiple extensions

  ducklake:
    isEnabled: true
    runner: standard
    repository: duckdb/ducklake
    pin: d318a545571d7d46eb751fa2aa5f6f4389285d3c
    submodules: recursive
    setup: ducklake-catalogs
    profiles:
      - name: autoload
        tests: test/sql/autoloading/autoload_data_path.test
        testConfig:
          kind: generated
          description: DuckLake filesystem autoloading profile with HTTPFS initially unloaded
          excludedExtensions:
            - httpfs
            - postgres_scanner
            - sqlite_scanner
          staticallyLoadedExtensions:
            - core_functions
            - parquet
      - name: sqlite
        tests: test/sql/*
        testConfig:
          kind: upstream
          path: test/configs/sqlite.json
      - name: postgres
        tests: test/sql/*
        runtimeSetup: ducklake-postgres-15
        testConfig:
          kind: upstream
          path: test/configs/postgres.json
    extensions:
      - name: ducklake
        isUsed: true
      - name: json
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
      - name: icu
        isUsed: true
      - name: sqlite_scanner
        isUsed: true
    ignoredTests:
      - path: test/sql/data_inlining/postgres_identifier_limit.test
        reason: Test is specific to the PostgreSQL catalog profile
        profiles:
          - sqlite

  postgres_scanner:
    isEnabled: true
    runner: postgres-scanner
    repository: duckdb/duckdb-postgres
    pin: 8f813f9b9c9e52a9074a050a0be60f49160a6baa
    submodules: recursive
    setup: postgres-17
    profiles:
      - name: all
        tests: test/sql/*
        testConfig:
          kind: generated
          description: PostgreSQL scanner compatibility profile
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
    extensions:
      - name: postgres_scanner
        isUsed: true
      - name: json
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
      - name: icu
        isUsed: true
    ignoredTests: []

  delta:
    isEnabled: true
    runner: standard
    repository: duckdb/duckdb-delta
    pin: 45c40878601b54b4188b09e08732fe0d576ad222
    submodules: recursive
    setup: none
    profiles:
      - name: all
        tests: test/sql/*
        testConfig:
          kind: generated
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
    extensions:
      - name: httpfs
        isUsed: true
      - name: azure
        isUsed: true
      - name: aws
        isUsed: true
      - name: delta
        isUsed: true
      - name: json
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
    ignoredTests: []

  iceberg:
    isEnabled: true
    runner: standard
    repository: duckdb/duckdb-iceberg
    pin: e6fe0a4b28ed13f4a1ae5c7e12bad338c6fc13c7
    submodules: recursive
    setup: none
    profiles:
      - name: all
        tests: test/sql/local/*
        testConfig:
          kind: generated
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
    extensions:
      - name: httpfs
        isUsed: true
      - name: avro
        isUsed: true
      - name: iceberg
        isUsed: true
      - name: tpch
        isUsed: true
    ignoredTests: []

  azure:
    isEnabled: true
    runner: standard
    repository: duckdb/duckdb-azure
    pin: 563589b2f24290a4dcdd4247eaedf2b544f9dbcd
    submodules: recursive
    setup: none
    profiles:
      - name: all
        tests: test/sql/*
        testConfig:
          kind: generated
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
    extensions:
      - name: azure
        isUsed: true
    ignoredTests: []

  unity_catalog:
    isEnabled: true
    runner: standard
    repository: duckdb/unity_catalog
    pin: d52a7ee8678a23a8e0f950e955b9ffa1df0c3395
    submodules: recursive
    setup: none
    profiles:
      - name: all
        tests: test/sql/*
        testConfig:
          kind: generated
          excludedExtensions: []
          staticallyLoadedExtensions:
            - core_functions
            - parquet
    extensions:
      - name: httpfs
        isUsed: true
      - name: delta
        isUsed: true
      - name: unity_catalog
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
    ignoredTests: []

  mssql:
    isEnabled: true
    runner: mssql-release
    repository: hugr-lab/mssql-extension
    pin: v0.2.1
    submodules: false
    setup: sqlserver-2022
    profiles:
      - name: all
        tests: test/sql/*
    extensions:
      - name: mssql
        isUsed: true
        installFrom: community
      - name: json
        isUsed: true
      - name: tpch
        isUsed: true
      - name: tpcds
        isUsed: true
      - name: icu
        isUsed: true
      - name: sqlite_scanner
        isUsed: true
      - name: azure
        isUsed: true
    ignoredTests:
      - path: test/sql/azure/azure_device_code.test
        reason: Requires Azure credential-chain parameters not supported by the DuckDB v1.5.4 Azure binary
      - path: test/sql/ctas/ctas_auto_tablock.test
        reason: Known MSSQL v0.2.1 CTAS compatibility failure under the pinned DuckDB v1.5.4 runtime
      - path: test/sql/ctas/ctas_if_not_exists.test
        reason: Known MSSQL v0.2.1 CTAS compatibility failure under the pinned DuckDB v1.5.4 runtime
      - path: test/sql/catalog/ddl_if_not_exists.test
        reason: MSSQL v0.2.1 returns a different SQL Server object-exists error message
