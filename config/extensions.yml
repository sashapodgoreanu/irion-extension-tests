schemaVersion: 4
runtime:
  operatingSystem: linux
  architecture: x86_64
  githubRunner: ubuntu-24.04
duckdb:
  version: v2.0.0
  ciToolsVersion: 969bc76276acec1c0a3922ff500d2ec3a1a3b037
defaultExtensions:
- name: httpfs
  isUsed: true
- name: mssql
  isUsed: true
  installFrom: community
- name: ducklake
  isUsed: true
- name: postgres_scanner
  isUsed: true
- name: icu
  isUsed: true
- name: azure
  isUsed: true
- name: delta
  isUsed: true
- name: iceberg
  isUsed: false
- name: unity_catalog
  isUsed: true
- name: bigquery
  isUsed: true
  installFrom: community
testBatteries:
  httpfs:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-httpfs
    pin: 77392a72077a85897db2519fae11e2c0da972b8a
    submodules: recursive
    services:
    - name: http-server
      type: python-http
      port: 8008
    - name: proxy
      type: squid
      port: 3128
    - name: object-store
      type: httpfs-minio
    prerequisites: []
    profiles:
    - name: sql
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: HTTPFS compatibility SQL suite
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests:
    - path: test/sql/copy/s3/parquet_s3_tpcds.test_slow
      reason: Requires TPC-DS answer fixtures that are not present in the standalone HTTPFS checkout
  ducklake:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/ducklake
    pin: 417a9117f590e8141742ac0579d02f6a90162e37
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: autoload
      tests: test/sql/autoloading/autoload_data_path.test
      services: []
      testConfig:
        kind: generated
        description: DuckLake filesystem autoloading profile with HTTPFS initially unloaded
        excludedExtensions:
        - httpfs
        - postgres_scanner
        - sqlite_scanner
        - delta
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    - name: sqlite
      tests: test/sql/*
      services: []
      testConfig:
        kind: upstream
        path: test/configs/sqlite.json
        excludedExtensions:
        - json
        - delta
    - name: postgres
      tests: test/sql/*
      services:
      - name: postgres-catalog
        type: postgres
        version: '15'
        database: ducklakedb
        username: postgres
        port: 5432
      testConfig:
        kind: upstream
        path: test/configs/postgres.json
        excludedExtensions:
        - json
        - delta
    extensions:
    - name: ducklake
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests:
    - path: test/sql/data_inlining/postgres_identifier_limit.test
      reason: Test is specific to the PostgreSQL catalog profile
      profiles:
      - sqlite
  postgres_scanner:
    isEnabled: true
    runner: postgres-scanner
    source: remote
    repository: duckdb/duckdb-postgres
    pin: c0f5a3c0c4b68b02afbf669d36d7f0e503985c88
    submodules: recursive
    services:
    - name: postgres
      type: postgres
      version: '17'
      database: postgres
      username: postgres
      port: 5432
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: PostgreSQL scanner compatibility profile
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: postgres_scanner
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    ignoredTests: []
  delta:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-delta
    pin: 9dcfb65b99fcafaa068222c2490abc143da4cc8e
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: azure
      isUsed: true
    - name: aws
      isUsed: true
    - name: delta
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    ignoredTests:
    - path: test/sql/cloud/minio_local/minio_local.test
      reason: Requires a MinIO S3 test server; Delta QA runs local filesystem fixtures only
      profiles:
      - all
    - path: test/sql/cloud/minio_local/gcs_r2.test
      reason: Requires the MinIO-compatible S3 endpoint for GCS and R2 credentials tests
      profiles:
      - all
  iceberg:
    isEnabled: false
    runner: standard
    source: remote
    repository: duckdb/duckdb-iceberg
    pin: b0ef95eda41c44734b2d229659190b18a5716eab
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/local/*
      services: []
      testConfig:
        kind: generated
        description: Iceberg local suite with dynamic repository loading
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    # Iceberg is disabled indefinitely, including its Avro/HTTPFS/TPCH test
    # dependencies. Re-enabling requires an explicit configuration change.
    extensions: []
    ignoredTests:
    - path: test/sql/local/iceberg_scans/iceberg_partition_stats.test
      reason: The shared dynamic extension repository autoloads Iceberg before the file's pre-require negative assertion; functional metadata coverage is enforced by verify-iceberg-metadata.py
      profiles:
      - all
    - path: test/sql/local/iceberg_scans/iceberg_column_stats.test
      reason: The shared dynamic extension repository autoloads Iceberg before the file's pre-require negative assertion; functional metadata coverage is enforced by verify-iceberg-metadata.py
      profiles:
      - all
  azure:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-azure
    pin: 906e92458c33309e5d9413e14a85aad7b4d2275f
    submodules: recursive
    services:
    - name: storage-emulator
      type: azurite
      port: 10000
    prerequisites: []
    profiles:
    - name: azurite
      tests: test/sql/http.test,test/sql/azure.test,test/sql/fs_logs.test,test/sql/azure_glob.test,test/sql/azure_writes.test,test/sql/azure_secret.test,test/sql/azure_vfs_ops.test,test/sql/http_log_redaction.test,test/sql/azure_scope_and_full_path.test
      services: []
      testConfig:
        kind: generated
        description: Azure local compatibility through Azurite
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    - name: proxy
      tests: test/sql/proxy/*
      services:
      - name: proxy
        type: squid
        port: 3128
      - name: proxy-auth
        type: squid
        port: 3129
        auth: true
      testConfig:
        kind: generated
        description: Azure proxy compatibility through local Squid services
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: azure
      isUsed: true
    ignoredTests: []
  unity_catalog:
    isEnabled: true
    runner: unity-catalog-pytest
    source: remote
    repository: duckdb/unity_catalog
    pin: cc59382f5292997293a57c2ab336c9aa97c05f2d
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: oss
      tests: test/oss_local
      services: []
    extensions:
    - name: httpfs
      isUsed: true
    - name: delta
      isUsed: true
    - name: unity_catalog
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    ignoredTests: []
  bigquery:
    isEnabled: true
    runner: standard
    source: remote
    repository: hafenkran/duckdb-bigquery
    pin: 5439a6a58439af4c05064f80a28b159c5a1424e7
    submodules: recursive
    services: []
    prerequisites:
    - type: google-bigquery
    - type: external-cloud-account
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: Google BigQuery compatibility profile
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: bigquery
      isUsed: true
      installFrom: community
    ignoredTests: []
  mssql:
    isEnabled: true
    runner: mssql-release
    source: remote
    repository: hugr-lab/mssql-extension
    pin: v0.3.0
    submodules: false
    services:
    - name: sqlserver
      type: sqlserver
      version: '2022'
      database: master
      username: sa
      port: 1433
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
    extensions:
    - name: mssql
      isUsed: true
      installFrom: community
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    - name: azure
      isUsed: true
    ignoredTests:
    - path: test/sql/azure/azure_device_code.test
      reason: Requires Azure credential-chain parameters pending revalidation against the DuckDB v2.0.0 Azure binary
    - path: test/sql/ctas/ctas_auto_tablock.test
      reason: Legacy MSSQL CTAS compatibility exclusion retained pending DuckDB v2.0.0 revalidation
    - path: test/sql/ctas/ctas_if_not_exists.test
      reason: Legacy MSSQL CTAS compatibility exclusion retained pending DuckDB v2.0.0 revalidation
    - path: test/sql/catalog/ddl_if_not_exists.test
      reason: MSSQL returns a different SQL Server object-exists error message for this compatibility case
  irion:
    isEnabled: true
    runner: standard
    source: self
    services: []
    prerequisites: []
    profiles:
    - name: baseline
      tests: test/sql/irion/*
      services: []
      testConfig:
        kind: upstream
        path: test/configs/irion.json
    extensions:
    - name: json
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests: []

  irion_extension_security:
    isEnabled: true
    runner: standard
    source: self
    services: []
    prerequisites: []
    profiles:
    - name: security
      tests: test/sql/irion_security/extension_security.test
      services: []
      testConfig:
        kind: generated
        description: Irion extension repository and community loading restrictions
        excludedExtensions:
        - mssql
        - bigquery
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: json
      isUsed: true
    ignoredTests: []
