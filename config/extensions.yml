schemaVersion: 4
runtime:
  operatingSystem: linux
  architecture: x86_64
  githubRunner: ubuntu-24.04
duckdb:
  version: v1.5.5
  ciToolsVersion: v1.5.5
defaultExtensions:
- name: httpfs
  isUsed: true
- name: mssql
  isUsed: true
  installFrom: community
- name: ducklake
  isUsed: true
- name: postgres_scanner
  isUsed: true
- name: icu
  isUsed: true
- name: azure
  isUsed: true
- name: delta
  isUsed: true
- name: iceberg
  isUsed: true
- name: unity_catalog
  isUsed: true
- name: bigquery
  isUsed: true
  installFrom: community
testBatteries:
  httpfs:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-httpfs
    pin: 827222fb45a043a7a852d1f7aae46901492a3cda
    submodules: recursive
    services:
    - name: http-server
      type: python-http
      port: 8008
    - name: proxy
      type: squid
      port: 3128
    - name: object-store
      type: httpfs-minio
    prerequisites: []
    profiles:
    - name: sql
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: HTTPFS compatibility SQL suite
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests:
    - path: test/sql/copy/s3/parquet_s3_tpcds.test_slow
      reason: Requires TPC-DS answer fixtures that are not present in the standalone HTTPFS checkout
  ducklake:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/ducklake
    pin: d8a1881e22516ea3d186d73e83c65fe5bd1a1dc4
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: autoload
      tests: test/sql/autoloading/autoload_data_path.test
      services: []
      testConfig:
        kind: generated
        description: DuckLake filesystem autoloading profile with HTTPFS initially unloaded
        excludedExtensions:
        - httpfs
        - postgres_scanner
        - sqlite_scanner
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    - name: sqlite
      tests: test/sql/*
      services: []
      testConfig:
        kind: upstream
        path: test/configs/sqlite.json
    - name: postgres
      tests: test/sql/*
      services:
      - name: postgres-catalog
        type: postgres
        version: '15'
        database: ducklakedb
        username: postgres
        port: 5432
      testConfig:
        kind: upstream
        path: test/configs/postgres.json
    extensions:
    - name: ducklake
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests:
    - path: test/sql/data_inlining/postgres_identifier_limit.test
      reason: Test is specific to the PostgreSQL catalog profile
      profiles:
      - sqlite
  postgres_scanner:
    isEnabled: true
    runner: postgres-scanner
    source: remote
    repository: duckdb/duckdb-postgres
    pin: 41223e51559cd581f1c06e170b71c71df25bbaac
    submodules: recursive
    services:
    - name: postgres
      type: postgres
      version: '17'
      database: postgres
      username: postgres
      port: 5432
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: PostgreSQL scanner compatibility profile
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: postgres_scanner
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    ignoredTests: []
  delta:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-delta
    pin: 45c40878601b54b4188b09e08732fe0d576ad222
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: azure
      isUsed: true
    - name: aws
      isUsed: true
    - name: delta
      isUsed: true
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    ignoredTests: []
  iceberg:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-iceberg
    pin: 45163a28e0ed6a2071a82a1bf1dd432d0216cf9c
    submodules: recursive
    services: []
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/local/*
      services: []
      testConfig:
        kind: generated
        description: Iceberg local suite with dynamic repository loading
        excludedExtensions:
        - iceberg
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: avro
      isUsed: true
    - name: iceberg
      isUsed: true
    - name: tpch
      isUsed: true
    ignoredTests:
    - path: test/sql/local/iceberg_scans/iceberg_partition_stats.test
      reason: The shared dynamic extension repository autoloads Iceberg before the file's pre-require negative assertion; functional metadata coverage is enforced by verify-iceberg-metadata.py
      profiles:
      - all
    - path: test/sql/local/iceberg_scans/iceberg_column_stats.test
      reason: The shared dynamic extension repository autoloads Iceberg before the file's pre-require negative assertion; functional metadata coverage is enforced by verify-iceberg-metadata.py
      profiles:
      - all
  azure:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/duckdb-azure
    pin: 003214c96d0caa39d5c3e27a9e1976a0692c7d37
    submodules: recursive
    services:
    - name: storage-emulator
      type: azurite
      port: 10000
    prerequisites: []
    profiles:
    - name: azurite
      tests: test/sql/http.test,test/sql/azure.test,test/sql/fs_logs.test,test/sql/azure_glob.test,test/sql/azure_writes.test,test/sql/azure_secret.test,test/sql/azure_vfs_ops.test,test/sql/http_log_redaction.test,test/sql/azure_scope_and_full_path.test
      services: []
      testConfig:
        kind: generated
        description: Azure local compatibility through Azurite
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    - name: proxy
      tests: test/sql/proxy/*
      services:
      - name: proxy
        type: squid
        port: 3128
      - name: proxy-auth
        type: squid
        port: 3129
        auth: true
      testConfig:
        kind: generated
        description: Azure proxy compatibility through local Squid services
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: azure
      isUsed: true
    ignoredTests: []
  unity_catalog:
    isEnabled: true
    runner: standard
    source: remote
    repository: duckdb/unity_catalog
    pin: fd851475780ca064d9706a5025ea6e5d1d9d7e23
    submodules: recursive
    services:
    - name: unity-catalog-oss
      type: unity-catalog-oss
      version: 1351641393665f5959b7b3d3c0c323a2b7e343c4
      port: 8080
    prerequisites: []
    profiles:
    - name: oss
      tests: test/sql/local_oss_unity_catalog/unity_catalog.test,test/sql/local_oss_unity_catalog/http_logs.test
      services: []
      testConfig:
        kind: generated
        description: Unity Catalog compatibility against the local OSS server
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: httpfs
      isUsed: true
    - name: delta
      isUsed: true
    - name: unity_catalog
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    ignoredTests:
    - path: test/sql/local_oss_unity_catalog/uc_catalog_write.test
      reason: Targets the separate uc_catalog extension rather than unity_catalog
      profiles:
      - oss
    - path: test/sql/local_oss_unity_catalog/checkpoint.test
      reason: Requires a writable UC_TEST_DATA fixture root not exposed by the OSS sample catalog lifecycle
      profiles:
      - oss
  bigquery:
    isEnabled: true
    runner: standard
    source: remote
    repository: hafenkran/duckdb-bigquery
    pin: 0c55a9b81646002edc0c73f36b703c8c39cea2ab
    submodules: recursive
    services: []
    prerequisites:
    - type: google-bigquery
    - type: external-cloud-account
    profiles:
    - name: all
      tests: test/sql/*
      services: []
      testConfig:
        kind: generated
        description: Google BigQuery compatibility profile
        excludedExtensions: []
        staticallyLoadedExtensions:
        - core_functions
        - parquet
    extensions:
    - name: bigquery
      isUsed: true
      installFrom: community
    ignoredTests: []
  mssql:
    isEnabled: true
    runner: mssql-release
    source: remote
    repository: hugr-lab/mssql-extension
    pin: v0.2.2
    submodules: false
    services:
    - name: sqlserver
      type: sqlserver
      version: '2022'
      database: master
      username: sa
      port: 1433
    prerequisites: []
    profiles:
    - name: all
      tests: test/sql/*
      services: []
    extensions:
    - name: mssql
      isUsed: true
      installFrom: community
    - name: json
      isUsed: true
    - name: tpch
      isUsed: true
    - name: tpcds
      isUsed: true
    - name: icu
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    - name: azure
      isUsed: true
    ignoredTests:
    - path: test/sql/azure/azure_device_code.test
      reason: Requires Azure credential-chain parameters not supported by the DuckDB v1.5.5 Azure binary
    - path: test/sql/ctas/ctas_auto_tablock.test
      reason: Known MSSQL v0.2.2 CTAS compatibility failure under the pinned DuckDB v1.5.5 runtime
    - path: test/sql/ctas/ctas_if_not_exists.test
      reason: Known MSSQL v0.2.2 CTAS compatibility failure under the pinned DuckDB v1.5.5 runtime
    - path: test/sql/catalog/ddl_if_not_exists.test
      reason: MSSQL v0.2.2 returns a different SQL Server object-exists error message
  irion:
    isEnabled: true
    runner: standard
    source: self
    services: []
    prerequisites: []
    profiles:
    - name: baseline
      tests: test/sql/irion/*
      services: []
      testConfig:
        kind: upstream
        path: test/configs/irion.json
    extensions:
    - name: json
      isUsed: true
    - name: sqlite_scanner
      isUsed: true
    ignoredTests: []
