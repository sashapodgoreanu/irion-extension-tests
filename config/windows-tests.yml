schemaVersion: 1
runtime:
  operatingSystem: windows
  architecture: x86_64
  githubRunner: windows-latest

# Windows-hosted GitHub runners execute DuckDB and SQLLogicTest natively.
# Batteries that require Linux container services remain covered by extension-qa.yml.
batteries:
  irion:
    profiles:
      - baseline
  ducklake:
    profiles:
      - autoload
      - sqlite
