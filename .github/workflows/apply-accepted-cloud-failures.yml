name: Apply accepted cloud failure contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 2 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/composable-services
          fetch-depth: 0

      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Apply contract and update golden hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-accepted-cloud-failures.py")
          text = path.read_text(encoding="utf-8")
          removal = '(ROOT / ".github/workflows/apply-accepted-cloud-failures.yml").unlink()\n'
          if text.count(removal) != 1:
              raise SystemExit(f"expected one workflow self-removal, found {text.count(removal)}")
          path.write_text(text.replace(removal, "", 1), encoding="utf-8")
          PY
          .venv/bin/python scripts/apply-accepted-cloud-failures.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/prepare-test-battery.py")
          text = path.read_text(encoding="utf-8")
          old = 'VALID_PREREQUISITES = {"google-bigquery"}'
          new = 'VALID_PREREQUISITES = {"google-bigquery", "external-cloud-account"}'
          if text.count(old) != 1:
              raise SystemExit(f"expected one runtime prerequisite whitelist, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run configuration contracts
        id: contracts
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -s tests/config -p 'test_*.py' -v \
            2>&1 | tee "${RUNNER_TEMP}/accepted-failure-contracts.log"

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-failure-contracts
          path: ${{ runner.temp }}/accepted-failure-contracts.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate contract failure
        if: steps.contracts.outcome != 'success'
        run: exit 1

      - name: Check shell syntax
        run: |
          bash -n scripts/service-manager.sh
          bash -n scripts/run-test-battery.sh
          bash -n scripts/run-standard-tests.sh
          bash -n scripts/run-postgres-scanner-tests.sh

      - name: Publish validated contract
        id: publish
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git status --short
            git add -A
            git commit -m "feat(ci): accept only external-account test failures"
            git push origin HEAD:phase4/composable-services
          } 2>&1 | tee "${RUNNER_TEMP}/accepted-failure-publish.log"

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-failure-publish
          path: ${{ runner.temp }}/accepted-failure-publish.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate publish failure
        if: steps.publish.outcome != 'success'
        run: exit 1
