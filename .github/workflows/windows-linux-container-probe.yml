name: Windows Linux Container Probe

on:
  push:
    branches:
      - 006-windows-docker-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Windows native process + Linux containers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe runner, WSL and Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== Windows ==='
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host '=== WSL ==='
          wsl --version
          wsl --status
          wsl --list --verbose

          Write-Host '=== Docker CLI / service ==='
          docker version
          docker info
          Get-Service *docker* | Format-Table -AutoSize

      - name: Ensure Ubuntu WSL distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'
          $installed = @(wsl --list --quiet) -replace "`0", '' | ForEach-Object { $_.Trim() }
          if ($installed -notcontains $distro) {
            Write-Host "Installing $distro..."
            wsl --install -d $distro --no-launch --web-download
            if ($LASTEXITCODE -ne 0) {
              throw "wsl --install failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host 'Installed WSL distributions:'
          wsl --list --verbose
          wsl -d $distro -u root -- bash -lc 'uname -a && cat /etc/os-release'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to launch $distro"
          }

      - name: Start Linux Docker Engine inside WSL
        id: docker_wsl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'

          wsl -d $distro -u root -- bash -lc 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq docker.io ca-certificates curl'
          if ($LASTEXITCODE -ne 0) {
            throw "Docker installation in WSL failed"
          }

          wsl -d $distro -u root -- bash -lc 'pkill dockerd || true; rm -f /var/run/docker.pid; nohup dockerd -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375 >/tmp/dockerd.log 2>&1 &'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to start dockerd in WSL"
          }

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            wsl -d $distro -u root -- bash -lc 'docker info >/dev/null 2>&1'
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Host '=== dockerd log ==='
            wsl -d $distro -u root -- bash -lc 'cat /tmp/dockerd.log || true'
            throw 'Docker Engine in WSL did not become ready'
          }

          $wslIp = (wsl -d $distro -u root -- bash -lc "hostname -I | awk '{print `$1}'").Trim()
          if (-not $wslIp) {
            throw 'Unable to resolve WSL IP address'
          }
          $dockerHost = "tcp://${wslIp}:2375"
          "wsl_ip=$wslIp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "docker_host=$dockerHost" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "WSL IP: $wslIp"
          Write-Host "Docker host: $dockerHost"
          docker -H $dockerHost version
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows docker.exe cannot reach the Linux daemon in WSL'
          }
          docker -H $dockerHost info --format 'OSType={{.OSType}} Architecture={{.Architecture}} ServerVersion={{.ServerVersion}}'

      - name: Run Linux container from Windows Docker CLI
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker run --rm hello-world
          if ($LASTEXITCODE -ne 0) {
            throw 'Linux hello-world container failed'
          }
          $os = (docker run --rm alpine:3.20 uname -s).Trim()
          if ($LASTEXITCODE -ne 0 -or $os -ne 'Linux') {
            throw "Expected Linux container; got '$os'"
          }
          Write-Host "Container kernel: $os"

      - name: Probe Windows workspace bind mount into Linux container
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'
          Set-Content -Path probe-marker.txt -Value 'windows-workspace-visible-from-linux-container' -Encoding ascii
          $workspaceLinux = (wsl -d $distro -u root -- wslpath -a $env:GITHUB_WORKSPACE).Trim()
          if (-not $workspaceLinux) {
            throw 'Unable to translate GITHUB_WORKSPACE to a WSL path'
          }
          Write-Host "Workspace in WSL: $workspaceLinux"
          $value = (docker run --rm -v "${workspaceLinux}:/workspace:ro" alpine:3.20 cat /workspace/probe-marker.txt).Trim()
          if ($LASTEXITCODE -ne 0 -or $value -ne 'windows-workspace-visible-from-linux-container') {
            throw "Bind mount failed; received '$value'"
          }
          Write-Host 'Bind mount verified.'

      - name: Probe Docker Compose against Linux daemon
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'
          $workspaceLinux = (wsl -d $distro -u root -- wslpath -a $env:GITHUB_WORKSPACE).Trim()
          @"
          services:
            probe:
              image: alpine:3.20
              volumes:
                - ${workspaceLinux}:/workspace:ro
              command: ["sh", "-lc", "test -f /workspace/probe-marker.txt && cat /workspace/probe-marker.txt"]
          "@ | Set-Content -Path build-compose-probe.yml -Encoding utf8

          docker compose version
          docker compose -f build-compose-probe.yml up --abort-on-container-exit --exit-code-from probe
          if ($LASTEXITCODE -ne 0) {
            throw 'Docker Compose probe failed'
          }
          docker compose -f build-compose-probe.yml down --remove-orphans

      - name: Probe PostgreSQL Linux container from native Windows client
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker rm -f qa-postgres 2>$null | Out-Null
          docker run -d --name qa-postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to start PostgreSQL container'
          }

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            docker exec qa-postgres pg_isready -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            docker logs qa-postgres
            throw 'PostgreSQL did not become ready'
          }

          $psql = 'C:\Program Files\PostgreSQL\17\bin\psql.exe'
          if (-not (Test-Path $psql)) {
            throw "Native Windows psql.exe not found at $psql"
          }
          $env:PGPASSWORD = 'postgres'

          $hostAddress = '127.0.0.1'
          & $psql -h $hostAddress -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT current_database(), version();'
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'localhost forwarding failed; retrying with WSL IP...'
            $hostAddress = $env:WSL_IP
            & $psql -h $hostAddress -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT current_database(), version();'
          }
          if ($LASTEXITCODE -ne 0) {
            docker logs qa-postgres
            throw 'Native Windows psql.exe could not reach PostgreSQL Linux container'
          }
          Write-Host "Native Windows PostgreSQL client reached container via $hostAddress:5432"

      - name: Probe MinIO Linux container from native Windows HTTP client
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker rm -f qa-minio 2>$null | Out-Null
          docker run -d --name qa-minio `
            -e MINIO_ROOT_USER=minio `
            -e MINIO_ROOT_PASSWORD=minio12345 `
            -p 9000:9000 `
            minio/minio server /data
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to start MinIO container'
          }

          $success = $false
          $endpoint = ''
          foreach ($hostAddress in @('127.0.0.1', $env:WSL_IP)) {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri "http://${hostAddress}:9000/minio/health/live"
                if ($response.StatusCode -eq 200) {
                  $success = $true
                  $endpoint = "http://${hostAddress}:9000"
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($success) { break }
          }
          if (-not $success) {
            docker logs qa-minio
            throw 'Native Windows HTTP client could not reach MinIO Linux container'
          }
          Write-Host "Native Windows HTTP client reached MinIO at $endpoint"

      - name: Publish probe summary
        if: always()
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '# Windows + Linux container probe'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- WSL IP: ``$env:WSL_IP``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Docker host: ``$env:DOCKER_HOST``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Goal: native Windows processes talking to Linux service containers on the same hosted runner.'
          if ($env:DOCKER_HOST) {
            docker ps -a
            docker logs qa-postgres 2>$null | Select-Object -Last 50
            docker logs qa-minio 2>$null | Select-Object -Last 50
            docker rm -f qa-postgres qa-minio 2>$null | Out-Null
          }
