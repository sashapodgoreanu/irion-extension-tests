name: Windows Linux Container Probe

on:
  push:
    branches:
      - 006-windows-docker-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Windows native process + Linux containers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe runner, WSL and Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== Windows ==='
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Write-Host '=== WSL ==='
          wsl --version
          wsl --status
          wsl --list --verbose
          Write-Host '=== Preinstalled Docker ==='
          docker version
          docker info
          Get-Service *docker* | Format-Table -AutoSize

      - name: Ensure Ubuntu WSL distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'
          $installed = @(wsl --list --quiet) -replace "`0", '' | ForEach-Object { $_.Trim() }
          if ($installed -notcontains $distro) {
            wsl --install -d $distro --no-launch --web-download
            if ($LASTEXITCODE -ne 0) { throw "wsl --install failed: $LASTEXITCODE" }
          }
          wsl --list --verbose
          wsl -d $distro -u root -- bash -lc 'uname -a && cat /etc/os-release'
          if ($LASTEXITCODE -ne 0) { throw "Unable to launch $distro" }

      - name: Start Linux Docker Engine inside WSL
        id: docker_wsl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'Ubuntu-24.04'

          wsl -d $distro -u root -- bash -lc 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq docker.io ca-certificates curl'
          if ($LASTEXITCODE -ne 0) { throw 'Docker installation in WSL failed' }

          wsl -d $distro -u root -- bash -lc 'pkill dockerd || true; rm -f /var/run/docker.pid; nohup dockerd --tls=false -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375 >/tmp/dockerd.log 2>&1 &'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start dockerd in WSL' }

          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            wsl -d $distro -u root -- bash -lc 'curl -fsS http://127.0.0.1:2375/_ping >/dev/null 2>&1'
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Host '=== dockerd log ==='
            wsl -d $distro -u root -- bash -lc 'cat /tmp/dockerd.log || true'
            Write-Host '=== listening sockets ==='
            wsl -d $distro -u root -- bash -lc 'ss -ltnp || true'
            throw 'Docker TCP endpoint in WSL did not become ready'
          }

          $addresses = ((wsl -d $distro -u root -- hostname -I) -replace "`0", '').Trim() -split '\s+'
          $wslIp = $addresses[0]
          if (-not $wslIp) { throw 'Unable to resolve WSL IP address' }

          $dockerHost = $null
          foreach ($candidate in @('tcp://127.0.0.1:2375', "tcp://${wslIp}:2375")) {
            Write-Host "Trying Docker endpoint $candidate"
            docker -H $candidate version
            if ($LASTEXITCODE -eq 0) {
              $dockerHost = $candidate
              break
            }
          }
          if (-not $dockerHost) {
            Write-Host '=== dockerd log ==='
            wsl -d $distro -u root -- bash -lc 'tail -n 200 /tmp/dockerd.log || true'
            throw 'Windows docker.exe cannot reach WSL dockerd over TCP'
          }

          "wsl_ip=$wslIp" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "docker_host=$dockerHost" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "WSL IP: $wslIp"
          Write-Host "Selected Docker host: $dockerHost"
          docker -H $dockerHost info --format 'OSType={{.OSType}} Architecture={{.Architecture}} ServerVersion={{.ServerVersion}}'

      - name: Run Linux container from Windows Docker CLI
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker run --rm hello-world
          if ($LASTEXITCODE -ne 0) { throw 'hello-world failed' }
          $os = (docker run --rm alpine:3.20 uname -s).Trim()
          if ($LASTEXITCODE -ne 0 -or $os -ne 'Linux') { throw "Expected Linux; got '$os'" }
          Write-Host "Container kernel: $os"

      - name: Probe Windows workspace bind mount
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content probe-marker.txt 'windows-workspace-visible-from-linux-container' -Encoding ascii
          $workspaceLinux = ((wsl -d Ubuntu-24.04 -u root -- wslpath -a $env:GITHUB_WORKSPACE) -replace "`0", '').Trim()
          Write-Host "WSL workspace: $workspaceLinux"
          $value = (docker run --rm -v "${workspaceLinux}:/workspace:ro" alpine:3.20 cat /workspace/probe-marker.txt).Trim()
          if ($LASTEXITCODE -ne 0 -or $value -ne 'windows-workspace-visible-from-linux-container') { throw "Bind mount failed: '$value'" }

      - name: Probe Docker Compose with WSL path
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceLinux = ((wsl -d Ubuntu-24.04 -u root -- wslpath -a $env:GITHUB_WORKSPACE) -replace "`0", '').Trim()
          @"
          services:
            probe:
              image: alpine:3.20
              volumes:
                - ${workspaceLinux}:/workspace:ro
              command: ["sh", "-lc", "test -f /workspace/probe-marker.txt && cat /workspace/probe-marker.txt"]
          "@ | Set-Content build-compose-probe.yml -Encoding utf8
          docker compose version
          docker compose -f build-compose-probe.yml up --abort-on-container-exit --exit-code-from probe
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose probe failed' }
          docker compose -f build-compose-probe.yml down --remove-orphans

      - name: Probe PostgreSQL from native Windows psql
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker rm -f qa-postgres 2>$null | Out-Null
          docker run -d --name qa-postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start PostgreSQL' }
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            docker exec qa-postgres pg_isready -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { docker logs qa-postgres; throw 'PostgreSQL not ready' }

          $psql = 'C:\Program Files\PostgreSQL\17\bin\psql.exe'
          if (-not (Test-Path $psql)) { throw "Missing native psql: $psql" }
          $env:PGPASSWORD = 'postgres'
          $connected = $false
          foreach ($hostAddress in @('127.0.0.1', $env:WSL_IP)) {
            & $psql -h $hostAddress -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT current_database(), version();'
            if ($LASTEXITCODE -eq 0) { Write-Host "Connected via $hostAddress"; $connected = $true; break }
          }
          if (-not $connected) { docker logs qa-postgres; throw 'Native Windows psql could not reach Linux PostgreSQL' }

      - name: Probe MinIO from native Windows HTTP client
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker rm -f qa-minio 2>$null | Out-Null
          docker run -d --name qa-minio -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 -p 9000:9000 minio/minio server /data
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start MinIO' }

          $connected = $false
          foreach ($hostAddress in @('127.0.0.1', $env:WSL_IP)) {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri "http://${hostAddress}:9000/minio/health/live"
                if ($response.StatusCode -eq 200) { Write-Host "MinIO reachable via $hostAddress"; $connected = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if ($connected) { break }
          }
          if (-not $connected) { docker logs qa-minio; throw 'Native Windows HTTP client could not reach Linux MinIO' }

      - name: Publish probe summary and cleanup
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          DOCKER_HOST: ${{ steps.docker_wsl.outputs.docker_host }}
          WSL_IP: ${{ steps.docker_wsl.outputs.wsl_ip }}
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '# Windows + Linux container probe'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY "- WSL IP: ``$env:WSL_IP``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Docker host: ``$env:DOCKER_HOST``"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Native Windows Docker engine is inspected separately from the Linux Docker daemon in WSL2.'
          if ($env:DOCKER_HOST) {
            docker ps -a
            docker rm -f qa-postgres qa-minio 2>$null | Out-Null
          }
