name: DuckDB Windows Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure-windows:
    name: Resolve Windows test matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      duckdb_version: ${{ steps.resolve.outputs.duckdb_version }}
      ci_tools_version: ${{ steps.resolve.outputs.ci_tools_version }}
      github_runner: ${{ steps.resolve.outputs.github_runner }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Resolve native Windows coverage
        id: resolve
        run: |
          .venv/bin/python scripts/prepare-windows-matrix.py \
            config/extensions.yml \
            config/windows-tests.yml \
            --output build/windows/matrix.json \
            >>"${GITHUB_OUTPUT}"

      - name: Test configuration contracts
        run: .venv/bin/python -m unittest discover -s tests/config -p 'test_*.py' -v

      - name: Upload Windows execution matrix
        uses: actions/upload-artifact@v4
        with:
          name: windows-execution-matrix
          path: build/windows/matrix.json
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build DuckDB on Windows x64
    needs: configure-windows
    runs-on: ${{ needs.configure-windows.outputs.github_runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build DuckDB and unittest with MSVC
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -DuckDBVersion '${{ needs.configure-windows.outputs.duckdb_version }}' `
            -CiToolsVersion '${{ needs.configure-windows.outputs.ci_tools_version }}' `
            -BuildJobs 4

      - name: Publish build timing
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows DuckDB build'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Get-Content build/artifact-windows/logs/build-info.txt | ForEach-Object {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- ``$_``"
          }

      - name: Upload Windows DuckDB runtime
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ needs.configure-windows.outputs.duckdb_version }}-windows-x86_64
          path: build/artifact-windows/
          if-no-files-found: error
          retention-days: 7

  test-windows:
    name: Windows SQLLogicTest ${{ matrix.name }}
    needs:
      - configure-windows
      - build-windows
    runs-on: ${{ needs.configure-windows.outputs.github_runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure-windows.outputs.matrix) }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Checkout remote test source
        if: matrix.sourceType == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.pin }}
          path: upstream/${{ matrix.name }}
          fetch-depth: 1
          submodules: ${{ matrix.submodules }}

      - name: Resolve test source root
        id: test_source
        shell: pwsh
        run: |
          if ('${{ matrix.sourceType }}' -eq 'self') {
            $root = $env:GITHUB_WORKSPACE
          }
          else {
            $root = Join-Path $env:GITHUB_WORKSPACE 'upstream/${{ matrix.name }}'
          }
          if (-not (Test-Path $root)) {
            throw "Windows test source root is missing: $root"
          }
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Windows DuckDB runtime
        uses: actions/download-artifact@v4
        with:
          name: duckdb-${{ needs.configure-windows.outputs.duckdb_version }}-windows-x86_64
          path: build/artifact-windows

      - name: Persist Windows battery configuration
        shell: pwsh
        env:
          BATTERY_CONFIG_JSON: ${{ toJSON(matrix) }}
        run: |
          New-Item -ItemType Directory -Force -Path 'build/windows/config' | Out-Null
          Set-Content `
            -Path 'build/windows/config/${{ matrix.name }}.json' `
            -Value $env:BATTERY_CONFIG_JSON `
            -Encoding utf8

      - name: Run native Windows SQLLogicTests
        shell: pwsh
        run: |
          python scripts/run-windows-standard-tests.py `
            'build/windows/config/${{ matrix.name }}.json' `
            '${{ steps.test_source.outputs.root }}' `
            'build/artifact-windows' `
            'build/windows/runtime/${{ matrix.name }}' `
            'build/windows/logs/${{ matrix.name }}'

      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs-${{ matrix.name }}
          path: build/windows/logs/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 7
