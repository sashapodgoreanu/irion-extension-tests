name: Phase 5 Finalization

on:
  push:
    branches:
      - phase5/structured-results
    paths:
      - scripts/phase5-finalize-repo.py
      - .github/workflows/phase5-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: phase5/structured-results
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Apply final Phase 5 patch
        run: python scripts/phase5-finalize-repo.py

      - name: Validate shell syntax
        run: bash -n scripts/service-manager.sh

      - name: Run configuration contracts
        run: python -m unittest discover -s tests/config -p 'test_*.py' -v

      - name: Commit finalized Phase 5
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: finish phase 5 local coverage contracts"
          git push origin HEAD:phase5/structured-results
