name: Apply HTTPFS Squid lifecycle fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 2 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/composable-services
          fetch-depth: 0

      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Apply Squid lifecycle fix
        run: .venv/bin/python scripts/apply-httpfs-squid-lifecycle-fix.py

      - name: Run configuration contracts
        run: .venv/bin/python -m unittest discover -s tests/config -p 'test_*.py' -v

      - name: Check shell syntax
        run: |
          bash -n scripts/service-manager.sh
          bash -n scripts/run-test-battery.sh
          bash -n scripts/run-standard-tests.sh

      - name: Publish validated fix
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .venv qa/__pycache__ tests/config/__pycache__
          git add -A
          git status --short
          git commit -m "fix(httpfs): isolate Squid service lifecycle"
          git push origin HEAD:phase4/composable-services
