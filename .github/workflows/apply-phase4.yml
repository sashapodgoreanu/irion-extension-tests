name: Apply Phase 4 payload

on:
  push:
    branches:
      - phase4/composable-services

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat(services): introduce composable QA service lifecycle') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/composable-services
          fetch-depth: 0

      - name: Apply Phase 4 implementation
        run: python3 scripts/apply-phase4-payload.py
