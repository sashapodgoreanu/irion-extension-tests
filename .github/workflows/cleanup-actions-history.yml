name: One-off Actions run history cleanup

on:
  push:
    branches:
      - maintenance/actions-run-history-cleanup-20261022
    paths:
      - .github/workflows/cleanup-actions-history.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete old runs except protected Linux and Windows runs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Remove historical run records
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          this_run = int(os.environ["GH_RUN_ID"])
          keep = {39756196008, 39756195797}
          assert repo == "sashapodgoreanu/irion-extension-tests"
          assert this_run not in keep
          base = f"https://api.github.com/repos/{repo}"
          
          def api(method, path):
              for attempt in range(45):
                  request = urllib.request.Request(base + path, method=method, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "one-off-actions-history-cleanup",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          payload = response.read()
                          return json.loads(payload) if payload else None
                  except urllib.error.HTTPError as exc:
                      detail = exc.read(1000).decode("utf-8", "replace")
                      if method == "DELETE" and exc.code == 404:
                          return None
                      rem = exc.headers.get("X-RateLimit-Remaining", "")
                      retry = exc.headers.get("Retry-After", "")
                      throttled = exc.code in (403, 429) and (rem == "0" or retry or "rate limit" in detail.lower())
                      if throttled or exc.code in (502, 503, 504):
                          reset = int(exc.headers.get("X-RateLimit-Reset", "0") or 0)
                          wait = min(3700, max(30, int(retry or 0), reset - int(time.time()) + 5))
                          print(f"HTTP {exc.code}, rate/backoff {wait}s; retry {attempt + 1}", flush=True)
                          time.sleep(wait)
                          continue
                      if method == "DELETE" and exc.code in (409, 422):
                          return False
                      raise RuntimeError(f"{method} {path}: {exc.code}: {detail[:300]}") from exc
              raise RuntimeError(f"Too many retries for {method} {path}")
          
          all_runs = []
          for page in range(1, 100):
              batch = api("GET", f"/actions/runs?per_page=100&page={page}")["workflow_runs"]
              all_runs.extend(batch)
              if len(batch) < 100:
                  break
          
          found = {r["id"] for r in all_runs}
          if not keep.issubset(found):
              raise RuntimeError(f"Protected latest two runs are not both present: {keep & found}. Nothing deleted.")
          # Never touch any run created after the two protected runs, including this maintenance job.
          targets = [r for r in all_runs if r["id"] < min(keep)]
          print(f"Found {len(all_runs)} runs; keep={sorted(keep)}; cleanup job={this_run}; delete={len(targets)}", flush=True)
          
          deleted = 0
          deferred = []
          for n, run in enumerate(targets, 1):
              rid = run["id"]
              if run["status"] != "completed":
                  try:
                      api("POST", f"/actions/runs/{rid}/cancel")
                  except RuntimeError as exc:
                      print(f"Cancellation warning {rid}: {exc}", flush=True)
                  for _ in range(30):
                      if api("GET", f"/actions/runs/{rid}")["status"] == "completed":
                          break
                      time.sleep(10)
              result = api("DELETE", f"/actions/runs/{rid}")
              if result is False:
                  deferred.append(rid)
              else:
                  deleted += 1
              if n % 25 == 0 or n == len(targets):
                  print(f"Progress: {n}/{len(targets)}, deleted={deleted}, deferred={len(deferred)}", flush=True)
              time.sleep(0.2)
          
          for rid in deferred:
              if api("GET", f"/actions/runs/{rid}")["status"] != "completed":
                  api("POST", f"/actions/runs/{rid}/force-cancel")
                  for _ in range(30):
                      if api("GET", f"/actions/runs/{rid}")["status"] == "completed":
                          break
                      time.sleep(10)
              if api("DELETE", f"/actions/runs/{rid}") is False:
                  print(f"Could not delete active run {rid}", flush=True)
              else:
                  deleted += 1
          
          remaining = api("GET", "/actions/runs?per_page=100&page=1")
          leftovers = [r["id"] for r in remaining["workflow_runs"] if r["id"] < min(keep)]
          print(f"DONE deleted={deleted}; remaining total={remaining['total_count']}; old runs remaining on first page={leftovers}", flush=True)
          if leftovers:
              sys.exit(1)
          PY
