name: DuckDB Extension Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Resolve extension configuration
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      duckdb_version: ${{ steps.resolve.outputs.duckdb_version }}
      ci_tools_version: ${{ steps.resolve.outputs.ci_tools_version }}
      operating_system: ${{ steps.resolve.outputs.operating_system }}
      architecture: ${{ steps.resolve.outputs.architecture }}
      github_runner: ${{ steps.resolve.outputs.github_runner }}
      enabled_batteries: ${{ steps.resolve.outputs.enabled_batteries }}
      execution_plan_sha256: ${{ steps.resolve.outputs.execution_plan_sha256 }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Compile execution plan and build matrix
        id: resolve
        run: |
          .venv/bin/python scripts/resolve-extension-config.py \
            config/extensions.yml \
            --plan-output build/plan/execution-plan.json \
            >>"${GITHUB_OUTPUT}"

      - name: Persist generated matrix
        env:
          MATRIX_JSON: ${{ steps.resolve.outputs.matrix }}
        run: printf '%s\n' "${MATRIX_JSON}" >build/plan/matrix.json

      - name: Upload execution plan
        uses: actions/upload-artifact@v4
        with:
          name: qa-execution-plan
          path: build/plan/
          if-no-files-found: error
          retention-days: 7

      - name: Test configuration contracts
        run: .venv/bin/python -m unittest discover -s tests/config -p 'test_*.py' -v

      - name: Report enabled batteries
        run: |
          echo "DuckDB: ${{ steps.resolve.outputs.duckdb_version }}"
          echo "Runtime: ${{ steps.resolve.outputs.operating_system }}/${{ steps.resolve.outputs.architecture }}"
          echo "GitHub runner: ${{ steps.resolve.outputs.github_runner }}"
          echo "Enabled batteries: ${{ steps.resolve.outputs.enabled_batteries }}"
          echo "Execution plan SHA-256: ${{ steps.resolve.outputs.execution_plan_sha256 }}"

  build:
    name: Prepare DuckDB runtime
    needs: configure
    runs-on: ${{ needs.configure.outputs.github_runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate DuckDB runtime cache key
        id: duckdb-runtime-key
        shell: bash
        run: |
          set -Eeuo pipefail

          DUCKDB_SHA="$(git rev-parse HEAD:duckdb)"
          CI_TOOLS_SHA="$(git rev-parse HEAD:extension-ci-tools)"

          BUILD_INPUT_HASH="$({
            printf '%s\n' \
              'cache-schema=v3' \
              'runner=${{ needs.configure.outputs.github_runner }}' \
              'operating-system=${{ needs.configure.outputs.operating_system }}' \
              'architecture=${{ needs.configure.outputs.architecture }}' \
              'duckdb-version=${{ needs.configure.outputs.duckdb_version }}' \
              'ci-tools-version=${{ needs.configure.outputs.ci_tools_version }}' \
              "duckdb-sha=${DUCKDB_SHA}" \
              "ci-tools-sha=${CI_TOOLS_SHA}"
            git ls-files -s -- \
              .gitmodules \
              CMakeLists.txt \
              extension_config.cmake \
              Makefile \
              scripts/build.sh \
              src
          } | sha256sum | cut -d' ' -f1)"

          CACHE_KEY="duckdb-runtime-v3-${{ needs.configure.outputs.operating_system }}-${{ needs.configure.outputs.architecture }}-${BUILD_INPUT_HASH}"
          echo "key=${CACHE_KEY}" >>"${GITHUB_OUTPUT}"
          echo "duckdb_sha=${DUCKDB_SHA}" >>"${GITHUB_OUTPUT}"
          echo "ci_tools_sha=${CI_TOOLS_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Restore cached DuckDB runtime
        id: duckdb-runtime-cache
        uses: actions/cache@v4
        with:
          path: build/artifact
          key: ${{ steps.duckdb-runtime-key.outputs.key }}

      - name: Install build tools
        if: steps.duckdb-runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build python3

      - name: Build DuckDB runtime
        if: steps.duckdb-runtime-cache.outputs.cache-hit != 'true'
        env:
          DUCKDB_VERSION: ${{ needs.configure.outputs.duckdb_version }}
          CI_TOOLS_VERSION: ${{ needs.configure.outputs.ci_tools_version }}
          BUILD_JOBS: 2
        run: bash scripts/build.sh

      - name: Validate restored or built runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f build/artifact/bin/duckdb
          test -f build/artifact/bin/unittest
          chmod +x build/artifact/bin/duckdb build/artifact/bin/unittest
          build/artifact/bin/duckdb --version
          build/artifact/bin/unittest --help >/dev/null

          {
            echo "cache_key=${{ steps.duckdb-runtime-key.outputs.key }}"
            echo "cache_hit=${{ steps.duckdb-runtime-cache.outputs.cache-hit }}"
            echo "operating_system=${{ needs.configure.outputs.operating_system }}"
            echo "architecture=${{ needs.configure.outputs.architecture }}"
            echo "github_runner=${{ needs.configure.outputs.github_runner }}"
            echo "duckdb_commit=${{ steps.duckdb-runtime-key.outputs.duckdb_sha }}"
            echo "ci_tools_commit=${{ steps.duckdb-runtime-key.outputs.ci_tools_sha }}"
          } >>build/artifact/logs/build-info.txt

      - name: Upload shared build
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ needs.configure.outputs.duckdb_version }}-${{ needs.configure.outputs.operating_system }}-${{ needs.configure.outputs.architecture }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ matrix.name }}
    needs:
      - configure
      - build
    runs-on: ${{ needs.configure.outputs.github_runner }}
    timeout-minutes: 120
    continue-on-error: ${{ contains(matrix.capabilities, 'accepted-failure') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Prepare battery configuration
        env:
          BATTERY_CONFIG_JSON: ${{ toJSON(matrix) }}
        run: |
          mkdir -p build/config build/results/${{ matrix.name }}
          printf '%s\n' "${BATTERY_CONFIG_JSON}" >"build/config/${{ matrix.name }}.json"
          echo "RESULT_STARTED_AT_MS=$(date +%s%3N)" >>"${GITHUB_ENV}"

      - name: Checkout remote test source
        if: matrix.sourceType == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.pin }}
          path: upstream/${{ matrix.name }}
          fetch-depth: 1
          submodules: ${{ matrix.submodules }}

      - name: Resolve test source root
        id: test_source
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ matrix.sourceType }}' == 'self' ]]; then
            root="${GITHUB_WORKSPACE}"
          else
            root="${GITHUB_WORKSPACE}/upstream/${{ matrix.name }}"
          fi
          test -d "${root}"
          echo "root=${root}" >>"${GITHUB_OUTPUT}"
          echo "Using ${{ matrix.sourceType }} test source: ${root}"

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: duckdb-${{ needs.configure.outputs.duckdb_version }}-${{ needs.configure.outputs.operating_system }}-${{ needs.configure.outputs.architecture }}
          path: build/artifact

      - name: Restore executable permissions
        run: |
          chmod +x build/artifact/bin/duckdb build/artifact/bin/unittest
          chmod +x scripts/*.sh scripts/*.py

      - name: Report accepted external-account failure
        if: contains(matrix.capabilities, 'accepted-failure')
        run: echo "Accepted failure contract — required external cloud account is unavailable"

      - name: Validate Google BigQuery credentials
        id: google_credentials
        if: contains(matrix.capabilities, 'google-cloud-auth')
        env:
          GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}
          BQ_TEST_DATASET: ${{ secrets.BQ_TEST_DATASET }}
        run: |
          set -Eeuo pipefail
          test -n "${GCS_SERVICE_ACCOUNT_KEY}" || { echo "Missing repository secret GCS_SERVICE_ACCOUNT_KEY" >&2; exit 1; }
          test -n "${BQ_TEST_PROJECT}" || { echo "Missing repository secret BQ_TEST_PROJECT" >&2; exit 1; }
          test -n "${BQ_TEST_DATASET}" || { echo "Missing repository secret BQ_TEST_DATASET" >&2; exit 1; }

      - name: Authenticate Google Cloud
        if: contains(matrix.capabilities, 'google-cloud-auth') && steps.google_credentials.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}

      - name: Set up Node for Azurite
        if: contains(matrix.capabilities, 'azurite')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install service dependencies
        if: contains(matrix.capabilities, 'squid') || contains(matrix.capabilities, 'postgres-client') || contains(matrix.capabilities, 'azurite') || contains(matrix.capabilities, 'unity-catalog-oss')
        shell: bash
        run: |
          set -Eeuo pipefail
          packages=()
          if [[ '${{ contains(matrix.capabilities, 'squid') }}' == 'true' ]]; then
            packages+=(squid)
          fi
          if [[ '${{ contains(matrix.capabilities, 'postgres-client') }}' == 'true' ]]; then
            packages+=(postgresql-client)
          fi
          if [[ '${{ contains(matrix.capabilities, 'unity-catalog-oss') }}' == 'true' ]]; then
            packages+=(openjdk-17-jdk-headless)
          fi
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${packages[@]}"
          fi
          if [[ '${{ contains(matrix.capabilities, 'azurite') }}' == 'true' ]]; then
            npm install --global azurite
            command -v az >/dev/null
            azurite --version
            az --version
          fi

      - name: Verify container runtime
        if: contains(matrix.capabilities, 'docker') || contains(matrix.capabilities, 'docker-compose')
        run: |
          docker version
          docker compose version

      - name: Run test battery
        id: run_battery
        env:
          ARTIFACT_DIR: build/artifact
          RESULT_STARTED_AT_MS: ${{ env.RESULT_STARTED_AT_MS }}
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}
          BQ_TEST_DATASET: ${{ secrets.BQ_TEST_DATASET }}
        run: |
          bash scripts/run-test-battery.sh \
            "build/config/${{ matrix.name }}.json" \
            "${{ steps.test_source.outputs.root }}"

      - name: Ensure structured test result
        if: always()
        env:
          BATTERY_CONFIG_JSON: ${{ toJSON(matrix) }}
          GOOGLE_CREDENTIALS_OUTCOME: ${{ steps.google_credentials.outcome }}
          RUN_BATTERY_OUTCOME: ${{ steps.run_battery.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/config build/logs/${{ matrix.name }} build/results/${{ matrix.name }}
          printf '%s\n' "${BATTERY_CONFIG_JSON}" >"build/config/${{ matrix.name }}.json"

          exit_code=0
          reason=""
          if [[ "${GOOGLE_CREDENTIALS_OUTCOME}" == "failure" ]]; then
            exit_code=1
            reason="missing-google-cloud-credentials"
          elif [[ "${RUN_BATTERY_OUTCOME}" == "failure" ]]; then
            exit_code=1
            reason="test-battery-failed"
          elif [[ "${RUN_BATTERY_OUTCOME}" != "success" ]]; then
            exit_code=2
            reason="test-battery-${RUN_BATTERY_OUTCOME:-not-run}"
          fi

          python3 scripts/write-test-result.py \
            --battery-config "build/config/${{ matrix.name }}.json" \
            --log-dir "build/logs/${{ matrix.name }}" \
            --output "build/results/${{ matrix.name }}/result.json" \
            --exit-code "${exit_code}" \
            --started-at-ms "${RESULT_STARTED_AT_MS:-0}" \
            --reason "${reason}" \
            --preserve-existing

      - name: Upload structured test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: build/results/${{ matrix.name }}/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: build/logs/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    name: Aggregate structured results
    needs:
      - configure
      - test
    if: always()
    runs-on: ${{ needs.configure.outputs.github_runner }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Install result tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Download execution plan
        uses: actions/download-artifact@v4
        with:
          name: qa-execution-plan
          path: build/plan

      - name: Download structured results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: build/results

      - name: Aggregate and validate results
        id: aggregate_results
        continue-on-error: true
        run: |
          .venv/bin/python scripts/aggregate-test-results.py \
            --plan build/plan/execution-plan.json \
            --results-root build/results \
            --result-schema schemas/test-result-v1.schema.json \
            --summary-schema schemas/test-summary-v1.schema.json \
            --policy config/result-policy.yml \
            --policy-schema schemas/result-policy-v1.schema.json \
            --output-json build/summary/summary.json \
            --output-markdown build/summary/summary.md

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f build/summary/summary.md ]]; then
            cat build/summary/summary.md >>"${GITHUB_STEP_SUMMARY}"
          else
            echo "# DuckDB extension QA summary" >>"${GITHUB_STEP_SUMMARY}"
            echo "Structured summary was not generated." >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload aggregate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-result-summary
          path: build/summary/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce aggregate verdict
        if: always()
        run: test '${{ steps.aggregate_results.outcome }}' = 'success'
