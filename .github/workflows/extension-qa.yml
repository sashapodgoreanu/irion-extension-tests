name: DuckDB Extension Compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase4:
    name: Apply Phase 4 implementation
    if: ${{ github.event.pull_request.number == 3 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/composable-services
          fetch-depth: 0

      - name: Apply validated Phase 4 payload
        run: python3 scripts/apply-phase4-payload.py
