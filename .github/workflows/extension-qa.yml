name: DuckDB Extension Compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase4:
    name: Apply Phase 4 implementation
    if: ${{ github.event.pull_request.number == 2 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/composable-services
          fetch-depth: 0
          show-progress: false

      - name: Apply validated Phase 4 payload
        id: apply
        continue-on-error: true
        run: python3 scripts/apply-phase4-payload.py >"${RUNNER_TEMP}/phase4-apply.log" 2>&1

      - name: Upload Phase 4 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-apply-diagnostic
          path: ${{ runner.temp }}/phase4-apply.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate apply failure
        if: steps.apply.outcome != 'success'
        run: |
          cat "${RUNNER_TEMP}/phase4-apply.log"
          exit 1
