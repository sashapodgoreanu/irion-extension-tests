name: DuckDB Extension Compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      batteries:
        description: 'Comma-separated test batteries (empty = all)'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Comma-separated platforms: linux,windows (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Resolve test matrix
    runs-on: ubuntu-24.04
    outputs:
      linux_matrix: ${{ steps.resolve.outputs.linux_matrix }}
      windows_matrix: ${{ steps.resolve.outputs.windows_matrix }}
      linux_enabled: ${{ steps.resolve.outputs.linux_enabled }}
      windows_enabled: ${{ steps.resolve.outputs.windows_enabled }}
      duckdb_version: ${{ steps.resolve.outputs.duckdb_version }}
      ci_tools_version: ${{ steps.resolve.outputs.ci_tools_version }}
      linux_operating_system: ${{ steps.resolve.outputs.linux_operating_system }}
      linux_architecture: ${{ steps.resolve.outputs.linux_architecture }}
      linux_github_runner: ${{ steps.resolve.outputs.linux_github_runner }}
      windows_operating_system: ${{ steps.resolve.outputs.windows_operating_system }}
      windows_architecture: ${{ steps.resolve.outputs.windows_architecture }}
      windows_github_runner: ${{ steps.resolve.outputs.windows_github_runner }}
      enabled_batteries: ${{ steps.resolve.outputs.enabled_batteries }}
      execution_plan_sha256: ${{ steps.resolve.outputs.execution_plan_sha256 }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements/qa.txt

      - name: Resolve runner matrices
        id: resolve
        shell: bash
        env:
          REQUESTED_BATTERIES: ${{ inputs.batteries }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
          CI_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          batteries="${REQUESTED_BATTERIES}"
          platforms="${REQUESTED_PLATFORMS}"

          # Run all enabled extension batteries on both platforms for this PR.
          # Keep manual workflow dispatch filters and default runner settings.
          if [[ "${CI_EVENT_NAME}" == "pull_request" && "${PR_HEAD_REF}" == "feature/irion-extension-security-filters" ]]; then
            batteries=""
            platforms="linux,windows"
          fi

          echo "Requested batteries: ${batteries:-all}"
          echo "Requested platforms: ${platforms:-default}"
          .venv/bin/python scripts/prepare-runner-matrices.py \
            config/extensions.yml \
            config/runners.yml \
            --plan-output build/plan/execution-plan.json \
            --output build/plan/runner-matrices.json \
            --batteries "${batteries}" \
            --platforms "${platforms}" \
            >>"${GITHUB_OUTPUT}"

      - name: Test configuration contracts
        run: .venv/bin/python -m unittest discover -s tests/config -p 'test_*.py' -v

      - name: Upload execution plan
        uses: actions/upload-artifact@v4
        with:
          name: qa-execution-plan
          path: build/plan/
          if-no-files-found: error
          retention-days: 7

      - name: Report resolved runtime matrices
        run: |
          echo "DuckDB: ${{ steps.resolve.outputs.duckdb_version }}"
          echo "Enabled runners: ${{ steps.resolve.outputs.enabled_runners }}"
          echo "Linux: ${{ steps.resolve.outputs.linux_operating_system }}/${{ steps.resolve.outputs.linux_architecture }} on ${{ steps.resolve.outputs.linux_github_runner }}"
          echo "Windows: ${{ steps.resolve.outputs.windows_operating_system }}/${{ steps.resolve.outputs.windows_architecture }} on ${{ steps.resolve.outputs.windows_github_runner }}"
          echo "Batteries: ${{ steps.resolve.outputs.enabled_batteries }}"
          echo "Execution plan SHA-256: ${{ steps.resolve.outputs.execution_plan_sha256 }}"

  # Windows and Linux share cloud accounts, so their batteries do not overlap.
  # Linux still runs after a failed Windows QA job and reports its own verdict.
  windows:
    name: Windows QA
    needs: configure
    if: ${{ needs.configure.result == 'success' && needs.configure.outputs.windows_enabled == 'true' }}
    uses: ./.github/workflows/qa-windows.yml
    with:
      matrix: ${{ needs.configure.outputs.windows_matrix }}
      duckdb_version: ${{ needs.configure.outputs.duckdb_version }}
      ci_tools_version: ${{ needs.configure.outputs.ci_tools_version }}
      operating_system: ${{ needs.configure.outputs.windows_operating_system }}
      architecture: ${{ needs.configure.outputs.windows_architecture }}
      github_runner: ${{ needs.configure.outputs.windows_github_runner }}
    secrets: inherit

  linux:
    name: Linux QA
    needs: [configure, windows]
    if: ${{ always() && needs.configure.result == 'success' && needs.configure.outputs.linux_enabled == 'true' }}
    uses: ./.github/workflows/qa-linux.yml
    with:
      matrix: ${{ needs.configure.outputs.linux_matrix }}
      duckdb_version: ${{ needs.configure.outputs.duckdb_version }}
      ci_tools_version: ${{ needs.configure.outputs.ci_tools_version }}
      operating_system: ${{ needs.configure.outputs.linux_operating_system }}
      architecture: ${{ needs.configure.outputs.linux_architecture }}
      github_runner: ${{ needs.configure.outputs.linux_github_runner }}
    secrets: inherit
