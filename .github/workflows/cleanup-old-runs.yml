name: Cleanup old workflow runs
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the latest 10 runs for each workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const workflow of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100
              });
              const ordered = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const run of ordered.slice(10)) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                core.info(`Deleted run ${run.id} from ${workflow.name}`);
              }
            }